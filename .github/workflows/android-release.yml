name: Android release

# Builds the Android app (apps/mobile) and publishes the APK as a GitHub pre-release:
# - a pull request that touches the app publishes android-v<version>-preview.pr<number>, updated on every push;
# - pushing a tag like android-v0.7.0-preview.1 publishes that release;
# - running it by hand with a tag does the same from the chosen branch; without a tag it only uploads the
#   APK as a workflow artifact.
# Desktop releases use release.yml (v* tags).
on:
  pull_request:
    paths:
      - "apps/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-release.yml"
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example android-v0.7.0-preview.2. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Release tag for a pull request
        if: github.event_name == 'pull_request'
        run: echo "RELEASE_TAG=android-v$(node -p "require('./package.json').version")-preview.pr${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Capacitor 8 builds with JDK 21 and Android SDK platform 36.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm run android:apk
      - name: Name the APK after the release
        run: |
          name="game-release-tracker-${RELEASE_TAG:-android-build}.apk"
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_NAME }}
      - name: Release notes
        if: env.RELEASE_TAG != ''
        run: |
          cat > release-notes.md <<'EOF'
          The Android version of Game Release Tracker, as a preview.

          **Install:** download the `.apk` below on your phone and open it. Android asks you to allow installs from your browser or file manager the first time. This is a debug-signed preview build, so to update from an earlier preview, uninstall the old one first (your library is kept only on the phone, so load or sync it again afterwards).

          **What's in it**
          - Every screen: Upcoming, Calendar, Completed Library, Randomizer, Year in Review and Settings, with IGDB sync and search (add your IGDB keys in Settings), editing, and notifications for watched games.
          - The Magic Academy look, with Day Term and Night Study (a candlelit dark mode). Settings → Look picks one or follows your phone.
          - Upcoming game pages are the Spellbook Entry, finished games the Dorm Corkboard, and Year in Review the animated Yearbook.
          - **Bring your desktop library over:** Settings → Your library → Import from the desktop app. Close the desktop app, copy `game-release-tracker.db` (Windows: `%APPDATA%\Game Release Tracker`; Linux: `~/.config/Game Release Tracker`) to your phone, and pick it. IGDB keys need entering again on the phone.
          - The desktop app's own backend runs inside the app; your library is one file in the app's private storage.

          **Not yet:** custom artwork uploads, wallpaper, and syncing while the app is closed.
          EOF
      - uses: softprops/action-gh-release@v2
        if: env.RELEASE_TAG != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Game Release Tracker for Android ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          prerelease: true
          files: ${{ env.APK_NAME }}
