name: Release

# Pushing a tag like v0.6.0 builds the Windows installer and zip, checks the packaged app with the smoke
# test, and publishes them as a GitHub Release with that version's changelog section as its notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The workflow attaches the files itself, so electron-builder must not try to publish.
      - run: npm run build
      - run: npm run rebuild
      - run: npx electron-builder --win --publish never
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        name: Release notes from the changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Game Release Tracker ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.zip
